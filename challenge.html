<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran</title>
</head>
<body>
    <form action="#">
    
    <fieldset>
        <legend>Akun</legend>
        <table>
            <tr>
                <td><label for="username">Username</label></td>
                <td><input type="username" name="nama_pengguna" id="username"</td>
            </tr>

            <tr>
                <td><label for="password">Password</label></td>
                <td><input type="password" name="sandi" id="password"></td>
            </tr>

            <tr>
                <td><label for="konfirmasi">Konfirmasi Password</label></td>
                <td><input type="password" name="sandi" id="konfirmasi"></td>
            </tr>
        </table>
    </fieldset>

    <fieldset>
        <legend>Data</legend>
        <table>
            <tr>
                <td><label for="name">Nama</label></td>
                <td><input type="text" name="nama" id="nama"></td>
            </tr>
            <tr>
                <td><label for="jenis_kelamin">Jenis Kelamin</label></td>
                <td>
                    <input type="radio" id="Pria" name="jenis_kelamin" value="Pria">
                    <label for="Pria">Pria</label><br>
                    <input type="radio" id="wanita" name="jenis_kelamin" value="wanita">
                    <label for="wanita">Wanita</label>
                </td>
            </tr>

            <tr>
                <td><label for="informasi">Informasi yang Disukai</label></td>
                <td><label for="Olahraga"><input type="checkbox" id="Olahraga" name="informasi" value="Olahraga">Olahraga</label><br>
                    <label for="travelling"><input type="checkbox" id="travelling" name="informasi" value="Travelling">Travelling</label><br>
                    <label for="Kesehatan"><input type="checkbox" id="Kesehatan" name="informasi" value="Kesehatan">Kesehatan</label>
                </td>
            </tr>
        </table>
    </fieldset>

    <button type="Submit" name="btn-submit">Submit</button>
    <button type="reset" name="btn-reset">Reset</button>
    </form>
</body>
</html>
